apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrador
  labels:
    app.kubernetes.io/name: integrador
    app.kubernetes.io/part-of: integrador
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: integrador
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integrador
        app.kubernetes.io/part-of: integrador
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: integrador
      containers:
        - name: integrador
          image: ghcr.io/empresa/integrador:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: integrador-config
            - secretRef:
                name: integrador-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
