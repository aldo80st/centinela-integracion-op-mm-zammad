apiVersion: v1
kind: ConfigMap
metadata:
  name: integrador-config
  labels:
    app.kubernetes.io/name: integrador
    app.kubernetes.io/component: middleware
    app.kubernetes.io/part-of: integrador
  namespace: default
data:
