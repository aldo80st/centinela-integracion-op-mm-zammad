apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels: { app: mattermost }
  template:
    metadata:
      labels: { app: mattermost }
    spec:
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:9.9
          env:
            - name: MM_CONFIG
              value: /mattermost/config/config.json
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: mattermost-credentials
                  key: MM_SQLSETTINGS_DATASOURCE
            - name: MM_SERVICESETTINGS_SITEURL
              value: "http://localhost:8065"
          ports:
            - containerPort: 8065
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
  namespace: mattermost
spec:
  type: NodePort
  selector:
    app: mattermost
  ports:
    - name: http
      port: 8065
      targetPort: 8065
      nodePort: 30065
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mm-postgres
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels: { app: mm-postgres }
  template:
    metadata:
      labels: { app: mm-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:14
          env:
            - { name: POSTGRES_DB, value: "mattermost" }
            - { name: POSTGRES_USER, value: "mm" }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mattermost-credentials
                  key: POSTGRES_PASSWORD
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mm-postgres
  namespace: mattermost
spec:
  type: ClusterIP
  selector:
    app: mm-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
