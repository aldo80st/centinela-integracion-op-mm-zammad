apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrador
  namespace: integraciones
spec:
  replicas: 1
  selector:
    matchLabels: { app: integrador }
  template:
    metadata:
      labels: { app: integrador }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/integrador-op-mm-zammad:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: OP_BASE_URL, value: "http://openproject.openproject.svc.cluster.local:80" }
            - { name: OP_TOKEN, value: "" }
            - { name: MM_WEBHOOK_URL, value: "" }
            - { name: ZAMMAD_BASE_URL, value: "http://zammad.zammad.svc.cluster.local:8080" }
            - { name: ZAMMAD_TOKEN, value: "" }
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: integrador
  namespace: integraciones
spec:
  type: NodePort
  selector:
    app: integrador
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
