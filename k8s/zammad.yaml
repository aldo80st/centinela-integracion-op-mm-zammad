apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad
  namespace: zammad
spec:
  replicas: 1
  selector:
    matchLabels: { app: zammad }
  template:
    metadata:
      labels: { app: zammad }
    spec:
      containers:
        - name: zammad
          image: zammad/zammad:6.4.0-35
          env:
            - { name: ZAMMAD_RAILS_ELASTICSEARCH_ENABLED, value: "false" }
            - { name: POSTGRESQL_DB, value: "zammad" }
            - { name: POSTGRESQL_USER, value: "zammad" }
            - { name: POSTGRESQL_PASSWORD, value: "zammad_password" }
            - { name: POSTGRESQL_HOST, value: "zammad-postgres.zammad.svc.cluster.local" }
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zammad
  namespace: zammad
spec:
  type: NodePort
  selector:
    app: zammad
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-postgres
  namespace: zammad
spec:
  replicas: 1
  selector:
    matchLabels: { app: zammad-postgres }
  template:
    metadata:
      labels: { app: zammad-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:14
          env:
            - { name: POSTGRES_DB, value: "zammad" }
            - { name: POSTGRES_USER, value: "zammad" }
            - { name: POSTGRES_PASSWORD, value: "zammad_password" }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-postgres
  namespace: zammad
spec:
  type: ClusterIP
  selector:
    app: zammad-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
