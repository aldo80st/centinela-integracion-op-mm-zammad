apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../openproject.yaml
  - ../mattermost.yaml
  - ../zammad.yaml
  - ../integrador.yaml
nameSuffix: -prod
patches:
  - target:
      kind: Deployment
      name: integrador
      namespace: integraciones
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
